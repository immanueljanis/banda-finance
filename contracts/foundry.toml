[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./script/data" }]

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
